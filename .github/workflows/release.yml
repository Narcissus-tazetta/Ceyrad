name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "リリースするバージョン (例: 1.2.3)"
        required: true
        type: string

permissions:
  contents: write

# タグを続けて2本pushすると、2つの実行がどちらもappcast.xmlをmainへpushしようとして
# 片方がnon-fast-forwardで落ちる。cancel-in-progress: false なので、走っている
# リリースは中断せず順番待ちにする。
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: macos-15
    steps:
      # サードパーティのactionはコミットSHAで固定する。このジョブはcontents: writeを
      # 持ちmainへpushもするため、可変タグ（v2 / stable）のまま使うと差し替えの影響が大きい。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # バージョン文字列は必ずenv経由でシェルに渡す。`${{ }}` をスクリプト本文へ
      # 直接展開すると、workflow_dispatchの入力がそのままシェルとして解釈される。
      - name: Determine version
        id: vars
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            RAW_VERSION="$INPUT_VERSION"
          else
            RAW_VERSION="$GITHUB_REF_NAME"
          fi
          VERSION="${RAW_VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set version from tag
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Support/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" Support/Info.plist

      - name: Build Ceyrad.app
        run: ./make-app.sh

      - name: Zip app bundle
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: ditto -c -k --sequesterRsrc --keepParent Ceyrad.app "Ceyrad-${TAG}-macos.zip"

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build DMG
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          chmod +x scripts/make_dmg.sh
          ./scripts/make_dmg.sh "$VERSION"
          mv "dist/Ceyrad-v${VERSION}-macos.dmg" "Ceyrad-${TAG}-macos.dmg"

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          files: |
            Ceyrad-${{ steps.vars.outputs.tag }}-macos.zip
            Ceyrad-${{ steps.vars.outputs.tag }}-macos.dmg
          generate_release_notes: true

      # if:にsecretsコンテキストを直接使うと "Unrecognized named-value: 'secrets'" になるため、
      # 事前のステップでSPARKLE_PRIVATE_KEYの有無をoutputに変換してから参照する。
      - name: Check Sparkle key
        id: sparkle
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: echo "has_key=$([ -n "$SPARKLE_PRIVATE_KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # SPARKLE_PRIVATE_KEY未設定の場合はSparkleの自動アップデートを配信しない
      # （generate_keys で鍵を作りリポジトリのSecretsに登録すると有効になる。詳細はREADME参照）
      - name: Sign update and publish appcast.xml
        if: ${{ steps.sparkle.outputs.has_key == 'true' }}
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: ${{ steps.vars.outputs.version }}
          TAG: ${{ steps.vars.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          chmod +x scripts/update_appcast.sh
          ZIP_ABS_PATH="$(pwd)/Ceyrad-${TAG}-macos.zip"

          # appcast.xmlはリリースタグではなくmainブランチで管理する。
          # 署名対象のzipは既にビルド済みなのでワークツリーを退避してから
          # mainへ切り替え、appcast.xmlだけを更新してpushする。
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          # 「Set version from tag」で書き換えたInfo.plistが残っていると、タグとmainで
          # 内容が異なる場合にcheckoutが失敗するため、切り替え前に元へ戻す
          git checkout -- Support/Info.plist
          git checkout main

          ./scripts/update_appcast.sh \
            "$ZIP_ABS_PATH" \
            "$VERSION" \
            "https://github.com/${REPOSITORY}/releases/download/${TAG}/Ceyrad-${TAG}-macos.zip"

          git add appcast.xml
          git commit -m "Update appcast.xml for ${TAG}"
          git push origin main

  # Windows版はポータブルzip（exe単体）とInno Setupインストーラの両方を
  # 同じリリースに追加する。コード署名は行わない方針（macOS版も無署名）。
  # Sparkle相当の自動更新も行わない
  # （アプリ内では新しいリリースの有無だけを確認し、ブラウザで開く）。
  build-windows:
    # 先にmacOS版のジョブがリリースを作る。同じタグに追記するだけにして、
    # 2つのジョブが同時にリリースを作ろうとする競合を避ける。
    needs: build-and-release
    # ただしmacOS側の最後のステップはappcast.xmlのmainへのpushで、これは保護設定や
    # 並行pushで落ちうる。その時点でリリース自体は数ステップ前に作成済みなので、
    # そこで転んだせいでWindowsバイナリだけ欠けたリリースが出るのは避ける。
    if: ${{ !cancelled() && needs.build-and-release.result != 'cancelled' }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # macOS側のジョブとは別ジョブなのでoutputsを共有できない。
      # 共有ジョブを挟むより、動作実績のあるmacOS側に手を入れないほうを選ぶ。
      - name: Determine version
        id: vars
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            RAW_VERSION="$INPUT_VERSION"
          else
            RAW_VERSION="$GITHUB_REF_NAME"
          fi
          VERSION="${RAW_VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: windows

      # ci-windows.ymlはブランチへのpushとPRでしか動かない。タグpushはどちらでもない
      # ので、リリースするコミットに対して一度もfmt/clippy/testが走らないことがある
      # （mainに乗っていないコミットにタグを打った場合など）。ここで同じ門を通す。
      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      # CARGO_PKG_VERSIONがアップデート確認の比較元になるため、
      # タグのバージョンをビルド前に埋め込む。
      # [package]直下の最初のversion行だけを置換する（rust-versionや
      # 依存クレートのバージョンに当てないため）。
      - name: Set version from tag
        shell: pwsh
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          $path = 'Cargo.toml'
          $content = Get-Content $path -Raw
          $pattern = [regex]::new('(?m)^version = "[^"]*"')
          $updated = $pattern.Replace($content, "version = ""$env:VERSION""", 1)
          if ($updated -eq $content) { throw "Cargo.tomlのversion行が見つかりませんでした" }
          Set-Content $path -Value $updated -Encoding utf8 -NoNewline

      # version行を書き換えた直後なので--lockedは使えない（Cargo.lockのceyradの
      # versionと食い違う）。fmt/clippy/testは書き換え前に--lockedで通してある。
      - name: Build
        run: cargo build --release --bin ceyrad

      - name: Zip
        shell: pwsh
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          Compress-Archive `
            -Path target/release/ceyrad.exe `
            -DestinationPath "Ceyrad-$env:TAG-windows.zip"

      # windows-latest ships Inno Setup, but that's runner-image trivia, not a
      # contract — fall back to installing it via choco (also preinstalled)
      # rather than let an image change silently break releases.
      - name: Build installer
        shell: pwsh
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $candidates = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
            )
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) {
            choco install innosetup --no-progress -y | Out-Null
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found even after installing Inno Setup" }

          & $iscc installer\ceyrad.iss "/DMyAppVersion=$env:VERSION"
          if ($LASTEXITCODE -ne 0) { throw "ISCC.exe failed with exit code $LASTEXITCODE" }

          Move-Item `
            "installer\dist\Ceyrad-Setup-$env:VERSION.exe" `
            "Ceyrad-$env:TAG-windows-setup.exe"

      - name: Attach to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          files: |
            windows/Ceyrad-${{ steps.vars.outputs.tag }}-windows.zip
            windows/Ceyrad-${{ steps.vars.outputs.tag }}-windows-setup.exe

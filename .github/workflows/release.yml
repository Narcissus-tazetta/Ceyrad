name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "リリースするバージョン (例: 1.2.3)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_VERSION="${{ inputs.version }}"
          else
            RAW_VERSION="$GITHUB_REF_NAME"
          fi
          VERSION="${RAW_VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set version from tag
        run: |
          VERSION="${{ steps.vars.outputs.version }}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Support/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" Support/Info.plist

      - name: Build Ceyrad.app
        run: ./make-app.sh

      - name: Zip app bundle
        run: ditto -c -k --sequesterRsrc --keepParent Ceyrad.app "Ceyrad-${{ steps.vars.outputs.tag }}-macos.zip"

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build DMG
        run: |
          chmod +x scripts/make_dmg.sh
          ./scripts/make_dmg.sh "${{ steps.vars.outputs.version }}"
          mv "dist/Ceyrad-v${{ steps.vars.outputs.version }}-macos.dmg" "Ceyrad-${{ steps.vars.outputs.tag }}-macos.dmg"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          files: |
            Ceyrad-${{ steps.vars.outputs.tag }}-macos.zip
            Ceyrad-${{ steps.vars.outputs.tag }}-macos.dmg
          generate_release_notes: true

      # if:にsecretsコンテキストを直接使うと "Unrecognized named-value: 'secrets'" になるため、
      # 事前のステップでSPARKLE_PRIVATE_KEYの有無をoutputに変換してから参照する。
      - name: Check Sparkle key
        id: sparkle
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: echo "has_key=$([ -n "$SPARKLE_PRIVATE_KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # SPARKLE_PRIVATE_KEY未設定の場合はSparkleの自動アップデートを配信しない
      # （generate_keys で鍵を作りリポジトリのSecretsに登録すると有効になる。詳細はREADME参照）
      - name: Sign update and publish appcast.xml
        if: ${{ steps.sparkle.outputs.has_key == 'true' }}
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          chmod +x scripts/update_appcast.sh
          VERSION="${{ steps.vars.outputs.version }}"
          TAG="${{ steps.vars.outputs.tag }}"
          ZIP_ABS_PATH="$(pwd)/Ceyrad-${TAG}-macos.zip"

          # appcast.xmlはリリースタグではなくmainブランチで管理する。
          # 署名対象のzipは既にビルド済みなのでワークツリーを退避してから
          # mainへ切り替え、appcast.xmlだけを更新してpushする。
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          # 「Set version from tag」で書き換えたInfo.plistが残っていると、タグとmainで
          # 内容が異なる場合にcheckoutが失敗するため、切り替え前に元へ戻す
          git checkout -- Support/Info.plist
          git checkout main

          ./scripts/update_appcast.sh \
            "$ZIP_ABS_PATH" \
            "$VERSION" \
            "https://github.com/${{ github.repository }}/releases/download/${TAG}/Ceyrad-${TAG}-macos.zip"

          git add appcast.xml
          git commit -m "Update appcast.xml for ${TAG}"
          git push origin main

  # Windows版はポータブルzip（exe単体）とInno Setupインストーラの両方を
  # 同じリリースに追加する。コード署名は行わない方針（macOS版も無署名）。
  # Sparkle相当の自動更新も行わない
  # （アプリ内では新しいリリースの有無だけを確認し、ブラウザで開く）。
  build-windows:
    # 先にmacOS版のジョブがリリースを作る。同じタグに追記するだけにして、
    # 2つのジョブが同時にリリースを作ろうとする競合を避ける。
    needs: build-and-release
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      # macOS側のジョブとは別ジョブなのでoutputsを共有できない。
      # 共有ジョブを挟むより、動作実績のあるmacOS側に手を入れないほうを選ぶ。
      - name: Determine version
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_VERSION="${{ inputs.version }}"
          else
            RAW_VERSION="$GITHUB_REF_NAME"
          fi
          VERSION="${RAW_VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows

      # CARGO_PKG_VERSIONがアップデート確認の比較元になるため、
      # タグのバージョンをビルド前に埋め込む。
      # [package]直下の最初のversion行だけを置換する（rust-versionや
      # 依存クレートのバージョンに当てないため）。
      - name: Set version from tag
        shell: pwsh
        run: |
          $path = 'Cargo.toml'
          $content = Get-Content $path -Raw
          $pattern = [regex]::new('(?m)^version = "[^"]*"')
          $updated = $pattern.Replace($content, 'version = "${{ steps.vars.outputs.version }}"', 1)
          if ($updated -eq $content) { throw "Cargo.tomlのversion行が見つかりませんでした" }
          Set-Content $path -Value $updated -Encoding utf8 -NoNewline

      - name: Build
        run: cargo build --release --bin ceyrad

      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive `
            -Path target/release/ceyrad.exe `
            -DestinationPath "Ceyrad-${{ steps.vars.outputs.tag }}-windows.zip"

      # windows-latest ships Inno Setup, but that's runner-image trivia, not a
      # contract — fall back to installing it via choco (also preinstalled)
      # rather than let an image change silently break releases.
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $candidates = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
            )
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) {
            choco install innosetup --no-progress -y | Out-Null
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found even after installing Inno Setup" }

          & $iscc installer\ceyrad.iss "/DMyAppVersion=${{ steps.vars.outputs.version }}"
          if ($LASTEXITCODE -ne 0) { throw "ISCC.exe failed with exit code $LASTEXITCODE" }

          Move-Item `
            "installer\dist\Ceyrad-Setup-${{ steps.vars.outputs.version }}.exe" `
            "Ceyrad-${{ steps.vars.outputs.tag }}-windows-setup.exe"

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          files: |
            windows/Ceyrad-${{ steps.vars.outputs.tag }}-windows.zip
            windows/Ceyrad-${{ steps.vars.outputs.tag }}-windows-setup.exe

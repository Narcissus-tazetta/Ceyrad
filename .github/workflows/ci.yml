name: CI

# Windows版（windows/）はci-windows.ymlが担当するため、ここでは対象外にする
on:
  push:
    branches: [main]
    paths-ignore:
      - "windows/**"
      - ".github/workflows/ci-windows.yml"
  pull_request:
    paths-ignore:
      - "windows/**"
      - ".github/workflows/ci-windows.yml"

jobs:
  lint:
    # lint.shの`swift format`サブコマンドはSwift 6（Xcode 16）以降の同梱のため、macos-15を使う
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run lint
        run: ./scripts/lint.sh

  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: swift test

      - name: Build
        run: swift build -c release

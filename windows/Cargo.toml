[package]
name = "ceyrad"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Discord Rich Presence for Apple Music (Windows port of Ceyrad)"
repository = "https://github.com/Narcissus-tazetta/Ceyrad"
license = "MIT"

[lib]
name = "ceyrad"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Windows-only, so `cargo test` on the pure logic still works on any host.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Threading",
] }

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
